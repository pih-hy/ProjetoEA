<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desconecta & Cresce</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>DESCONECTA & CRESCE</h1>
      <p>Um dia por semana sem celular, mais conexão com você mesmo. Seu pet vai crescer junto com você!</p>
    </header>

    <button class="start-button">Começar Jornada</button>

    <div class="user-info">
      <div class="pet-info">
        <img src="pet.png" alt="Pet" class="pet-icon" />
        <div>
          <h3>Nome do Usuário</h3>
          <p>Próximo Dia Desconectado</p>
        </div>
      </div>
      <div class="progress">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <span>0%</span>
      </div>
    </div>

    <div class="section">
      <h2>Atividades Offline</h2>
      <div class="box-grid">
        <div class="box">Ler um livro</div>
        <div class="box">Fazer uma caminhada</div>
        <div class="box">Cozinhar algo novo</div>
      </div>
    </div>

    <div class="section">
      <h2>Recompensas</h2>
      <div class="box-grid">
        <div class="box">Primeiro dia</div>
        <div class="box">Leitor da semana</div>
        <div class="box">Chef offline</div>
      </div>
    </div>
  </div>
</body>
</html>
